services:
  birdnet-go:
    image: ghcr.io/tphakala/birdnet-go:latest
    restart: unless-stopped
    # Configure BirdNET-Go according to its own docs.
    # Volumes/env omitted here intentionally.

  birdnet-dashboard:
    image: ghcr.io/your-org/birdnet-dashboard:latest
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Container-scoped setting lets UID 101 bind port 80 without capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    depends_on:
      - birdnet-go
    ports:
      # Omit this published port when routing through Traefik.
      - "127.0.0.1:8080:8080"
    environment:
      - BIRDNET_API_BASE_URL=http://birdnet-go:8080
      - SUMMARY_CACHE_FILE=/cache/summary-30d.json
      - RECENT_CACHE_FILE=/cache/recent-detections.json
      - FAMILY_CACHE_FILE=/cache/family-matches.json
      - "HEALTHCHECK_TOKEN=${HEALTHCHECK_TOKEN:?Set a random token in the environment}"
      # Runtime frontend branding/config (no rebuild required):
      - VITE_SITE_NAME=My Bird Dashboard
      - VITE_SITE_TAGLINE=Live detections from my station.
      - VITE_SITE_SUBTITLE=BirdNET-Go
      - VITE_LOCALE=en
      - VITE_DEFAULT_THEME=system
      # Optional: direct frontend-to-API base URL override.
      # Keep empty to use same-origin proxy.
      - VITE_BIRDNET_API_BASE_URL=
    volumes:
      # New named volumes inherit /cache ownership (UID/GID 101:101) from the image.
      - birdnet-dashboard-cache:/cache

volumes:
  birdnet-dashboard-cache:
