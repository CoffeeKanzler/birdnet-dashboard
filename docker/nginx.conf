server {
    listen 80;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /api/v2/summary/30d {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 50;

        if ($request_method = OPTIONS) {
            include /etc/nginx/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 3s;
    }

    location = /healthz {
        set $health_token "${HEALTHCHECK_TOKEN}";
        set $health_local 0;
        if ($remote_addr = 127.0.0.1) { set $health_local 1; }
        if ($remote_addr = ::1) { set $health_local 1; }
        set $health_token_configured 0;
        if ($health_token != "") { set $health_token_configured 1; }
        set $health_token_valid 0;
        if ($http_x_health_token = $health_token) { set $health_token_valid 1; }
        set $health_token_pair "${health_token_configured}${health_token_valid}";
        set $health_access 0;
        if ($health_local = 1) { set $health_access 1; }
        if ($health_token_pair = 11) { set $health_access 1; }
        if ($health_access = 0) { return 404; }

        limit_req zone=api_per_ip burst=10 nodelay;
        limit_conn conn_per_ip 10;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 2s;
    }
    location = /healthz/ {
        return 308 /healthz;
    }

    location = /readyz {
        set $health_token "${HEALTHCHECK_TOKEN}";
        set $health_local 0;
        if ($remote_addr = 127.0.0.1) { set $health_local 1; }
        if ($remote_addr = ::1) { set $health_local 1; }
        set $health_token_configured 0;
        if ($health_token != "") { set $health_token_configured 1; }
        set $health_token_valid 0;
        if ($http_x_health_token = $health_token) { set $health_token_valid 1; }
        set $health_token_pair "${health_token_configured}${health_token_valid}";
        set $health_access 0;
        if ($health_local = 1) { set $health_access 1; }
        if ($health_token_pair = 11) { set $health_access 1; }
        if ($health_access = 0) { return 404; }

        limit_req zone=api_per_ip burst=10 nodelay;
        limit_conn conn_per_ip 10;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 2s;
    }
    location = /readyz/ {
        return 308 /readyz;
    }

    location = /cachez {
        set $health_token "${HEALTHCHECK_TOKEN}";
        set $health_local 0;
        if ($remote_addr = 127.0.0.1) { set $health_local 1; }
        if ($remote_addr = ::1) { set $health_local 1; }
        set $health_token_configured 0;
        if ($health_token != "") { set $health_token_configured 1; }
        set $health_token_valid 0;
        if ($http_x_health_token = $health_token) { set $health_token_valid 1; }
        set $health_token_pair "${health_token_configured}${health_token_valid}";
        set $health_access 0;
        if ($health_local = 1) { set $health_access 1; }
        if ($health_token_pair = 11) { set $health_access 1; }
        if ($health_access = 0) { return 404; }

        limit_req zone=api_per_ip burst=10 nodelay;
        limit_conn conn_per_ip 10;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 2s;
    }
    location = /cachez/ {
        return 308 /cachez;
    }

    location = /api/v2/detections {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 50;

        if ($request_method = OPTIONS) {
            include /etc/nginx/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        if ($args !~ ^(|numResults=[0-9]*&offset=[0-9]*|offset=[0-9]*&numResults=[0-9]*|numResults=[0-9]*|offset=[0-9]*|queryType=search&search=[^&]+|queryType=search&search=[^&]+&numResults=[0-9]*|queryType=search&search=[^&]+&offset=[0-9]*|queryType=search&(search=[^&]+&numResults=[0-9]*&offset=[0-9]*|search=[^&]+&offset=[0-9]*&numResults=[0-9]*|numResults=[0-9]*&search=[^&]+&offset=[0-9]*|numResults=[0-9]*&offset=[0-9]*&search=[^&]+|offset=[0-9]*&search=[^&]+&numResults=[0-9]*|offset=[0-9]*&numResults=[0-9]*&search=[^&]+)|start_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&end_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]|start_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&end_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&numResults=[0-9]*|start_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&end_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&offset=[0-9]*|start_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&end_date=[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]&numResults=[0-9]*&offset=[0-9]*)$) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 3s;
    }

    location = /api/v2/species {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 30;

        if ($request_method = OPTIONS) {
            include /etc/nginx/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        if ($args !~ ^scientific_name=[^&]+$) {
            return 403;
        }

        proxy_pass http://birdnet-go:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_connect_timeout 3s;
    }

    location = /api/v2/detections/recent {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn conn_per_ip 30;

        if ($request_method = OPTIONS) {
            include /etc/nginx/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        if ($args !~ ^(|limit=[0-9]*)$) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_connect_timeout 3s;
    }

    location = /api/v2/family-matches {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_conn conn_per_ip 30;

        if ($request_method = OPTIONS) {
            include /etc/nginx/security-headers.conf;
            add_header Allow "GET, HEAD, OPTIONS";
            return 204;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        if ($arg_familyCommon !~ "^.{1,120}$") {
            return 403;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header x-internal-summary-proxy ${INTERNAL_PROXY_VALUE};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 3s;
    }

    location /api/v2/ {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /runtime-config.js {
        alias /cache/runtime-config.js;
        default_type application/javascript;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
